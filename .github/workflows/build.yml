name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: go vet + test
        run: |
          go vet ./internal/...
          go test ./internal/...

  # Build scrcpy from source with the physical-pixel flex patch applied.
  scrcpy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (static scrcpy build)
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm pkg-config git curl \
            ffmpeg libavcodec-dev libavdevice-dev libavformat-dev libavutil-dev \
            libswresample-dev libusb-1.0-0 libusb-1.0-0-dev libv4l-dev \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev \
            libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libva-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Build patched scrcpy (static)
        run: STATIC=1 ./packaging/build-scrcpy.sh

      - name: Package
        run: tar czf scrcpy-patched.tar.gz -C build scrcpy-patched

      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-patched
          path: scrcpy-patched.tar.gz
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-22.04
    needs: [test, scrcpy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config \
            imagemagick curl file

      - name: Install wails + appimagetool
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          curl -fL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - uses: actions/download-artifact@v4
        with:
          name: scrcpy-patched

      - name: Unpack patched scrcpy
        run: tar xzf scrcpy-patched.tar.gz -C build

      - name: Build AppImage (bundles patched scrcpy)
        run: SCRCPY_DIR="$PWD/build/scrcpy-patched" ./packaging/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpydesktoplauncher-appimage
          path: build/*.AppImage
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.AppImage
          generate_release_notes: true
